<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferreteria Los Maestros - Registro</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header>
    <h1>Registro</h1>
    <nav>
      <a href="ferreteria.html">Inicio</a>
      <a href="login.html">Login</a>
    </nav>
  </header>
  <main>
    <form id="form-registro">
      <label>RUN (sin puntos ni guion):</label>
      <input type="text" id="run" required>
      <label>Nombre:</label>
      <input type="text" id="nombre" maxlength="50" required>
      <label>Apellidos:</label>
      <input type="text" id="apellidos" maxlength="100" required>
      <label>Correo:</label>
      <input type="email" id="correo" maxlength="100" required>
      <label>Región:</label>
      <select id="region" required><option value="">Seleccione Región</option></select>
      <label>Comuna:</label>
      <select id="comuna" required><option value="">Seleccione Comuna</option></select>
      <label>Dirección:</label>
      <input type="text" id="direccion" maxlength="300" required>
      <button type="submit">Registrarse</button>
    </form>
  </main>
  <footer>
    <p>&copy; 2026 Ferretería Los Maestros.</p>
    </footer>
    <script src="js/validaciones.js"></script>
    
</body>
</html>
